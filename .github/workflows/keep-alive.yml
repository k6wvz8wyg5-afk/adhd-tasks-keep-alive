name: Keep Brain Dump awake
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: keep-alive
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --connect-timeout 15 --max-time 75 --retry 1 --retry-delay 5 https://adhd-tasks.onrender.com/api/health)
          printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok", "Service unhealthy"; assert d.get("mongoConnected") is True, "Database unavailable"; print("Service and database healthy; uptime:", d.get("uptimeSeconds"))'
